name: Build Lunar Horizons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate resources
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('src/main/resources').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Validate PNG textures and model references
        run: python3 scripts/validate_textures.py
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Lunar-Horizons-Fabric-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
